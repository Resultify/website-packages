# The full checks: types, unit tests, browser tests and a build. Run by Checks on the release
# PR once it is ready for review, and by Release before it publishes.
name: Verify
on:
  workflow_call:
    inputs:
      ref:
        description: What to check out. Empty means the ref of the event that ran the caller.
        type: string
        default: ""
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      # Playwright runs on Node
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun test
      # In the runner's own Google Chrome (channel: "chrome" in playwright.config.ts)
      - run: bun run e2e
      - run: bun scripts/build.ts

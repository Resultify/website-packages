# The full checks: types, unit tests, browser tests and a build. Run by Checks on every push to
# main, so a release starts from a commit that passed them, and by Deploy before it publishes.
name: Verify
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      # Playwright runs on Node
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun test
      # In the runner's own Google Chrome (channel: "chrome" in playwright.config.ts)
      - run: bun run e2e
      - run: bun scripts/build.ts

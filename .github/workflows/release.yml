# On every push to main, release-please updates its draft release PR. When that PR merges, it tags
# the version and makes the GitHub release; this workflow then sets the release's notes from
# CHANGELOG.md, checks the tag's code, builds it and publishes it to GitHub Pages.
# Run by hand, it publishes a tag again: the one given, or the latest release.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish. Empty means the latest release, or main if there is none.
        type: string
        default: ""
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
      - if: steps.rp.outputs.release_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.rp.outputs.tag_name }}
      - if: steps.rp.outputs.release_created == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Release notes from CHANGELOG.md
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
          VERSION: ${{ steps.rp.outputs.version }}
        run: |
          bun scripts/release-notes.ts "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
  # What to publish: the new tag, the tag given by hand, or the latest release
  target:
    needs: release-please
    # always(): on a run by hand, release-please is skipped, and a skipped job skips those after it
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          INPUT: ${{ inputs.ref }}
        run: |
          ref="${TAG:-$INPUT}"
          if [ -z "$ref" ]; then
            ref="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || echo main)"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
  verify:
    needs: target
    if: always() && needs.target.result == 'success'
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.target.outputs.ref }}
  # The run's own ref is main, which the github-pages environment allows; only the code checked out
  # is the tag
  deploy:
    needs: [target, verify]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun scripts/build.ts --frozen
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5

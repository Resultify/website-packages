# PR titles and commit messages keep the rule in scripts/messages.ts. A push to main also gets the
# full checks (Verify), so a release starts from a commit that passed them.
name: Checks
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      # Titles and other event text go through env:, never straight into run:
      - name: PR title and commits
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: bun scripts/check-messages.ts --title "$TITLE" --range "$RANGE"
      # Checked once they have landed: a red run, nothing blocked
      - name: Pushed commits
        if: github.event_name == 'push'
        env:
          RANGE: ${{ github.event.before }}..${{ github.event.after }}
        run: bun scripts/check-messages.ts --range "$RANGE"
  verify:
    if: github.event_name == 'push'
    uses: ./.github/workflows/verify.yml
